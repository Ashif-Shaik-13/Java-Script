<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Project</title>\
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <h1>Hello!</h1>
        <p>If this text is styled, Bootstrap is working.</p>
    </div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-4 col-md-6 col-sm-12 bg-light p-3">Column 1</div>
            <div class="col-lg-4 col-md-6 col-sm-12 bg-secondary text-white p-3">Column 2</div>
            <div class="col-lg-4 col-md-6 col-sm-12 bg-info p-3">Column 3</div>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-4 col-md-6 col-sm-12 bg-light p-3">
                <h5>Main Column with Nested Row</h5>
                <div class="row">
                    <div class="col-6 bg-warning p-2">Sub-column A</div>
                    <div class="col-6 bg-success text-white p-2">Sub-column B</div>
        </div>
    </div>

</body>
</html>
